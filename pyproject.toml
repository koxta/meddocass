[project]
name = "meddocass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
]

[project.scripts]
meddocass = "meddocass:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.fastapi]
entrypoint = "meddocass.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
